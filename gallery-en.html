<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BD4UI | Lab Gallery</title>
    <meta
      name="description"
      content="The BD4UI gallery page for lab group photos, event snapshots, and everyday moments."
    >
    <link rel="alternate" hreflang="zh-CN" href="gallery.html">
    <link rel="alternate" hreflang="en" href="gallery-en.html">
    <link rel="icon" type="image/svg+xml" href="assets/brand/bd4ui-logo.svg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body id="top">
    <header class="site-header">
      <a class="brand" href="index-en.html" aria-label="BD4UI homepage">
        <span class="brand-mark">
          <img src="assets/brand/bd4ui-logo.svg" alt="Big Data for Urban Intelligence Lab logo">
        </span>
        <span class="brand-text">
          <strong>BD4UI</strong>
          <small>Central South University</small>
        </span>
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="site-nav" id="site-nav" aria-label="Main navigation">
        <a href="index-en.html">Home</a>
        <a href="#group">Group Photos</a>
        <a href="#moments">Moments</a>
      </nav>

      <div class="header-actions">
        <button
          class="theme-toggle"
          type="button"
          aria-label="Toggle theme"
          aria-pressed="false"
          data-light-label="Light"
          data-dark-label="Ink"
        >
          <span class="theme-toggle-icon" aria-hidden="true"></span>
          <span class="theme-toggle-text">Light</span>
        </button>

        <div class="language-switch" aria-label="Language switch">
          <a href="gallery.html">&#x4E2D;&#x6587;</a>
          <span>EN</span>
        </div>
      </div>
    </header>

    <main class="gallery-shell">
      <section class="gallery-section" id="group">
        <div class="section-heading">
          <p class="eyebrow">Group Photos</p>
          <h2>Group Photos</h2>
        </div>
        <div class="gallery-grid">
          <article class="gallery-card">
            <img class="gallery-photo" src="assets/gallery/all_v1.jpg" alt="Group photo 1"></article>
          <article class="gallery-card">
            <img class="gallery-photo" src="assets/gallery/all_v2.jpg" alt="Group photo 2"></article>
          <article class="gallery-card">
            <img class="gallery-photo" src="assets/gallery/all_v3.jpg" alt="Group photo 3"></article>
          <article class="gallery-card">
            <img class="gallery-photo" src="assets/gallery/all_v4.jpg" alt="Group photo 4"></article>
          <article class="gallery-card">
            <img class="gallery-photo" src="assets/gallery/grad_22.jpg" alt="Research group photo"></article>
        </div>
      </section>

      <section class="gallery-section" id="moments">
        <div class="section-heading">
          <p class="eyebrow">Moments</p>
          <h2>Activity Photos</h2>
        </div>
        <div class="gallery-grid">
          <article class="gallery-card">
            <img class="gallery-photo" src="assets/gallery/21.jpg" alt="Project showcase photo"></article>
          <article class="gallery-card">
            <img class="gallery-photo" src="assets/gallery/2026_2.jpg" alt="2026 activity photo"></article>
          <article class="gallery-card">
            <img class="gallery-photo" src="assets/gallery/nuaa_2.jpg" alt="Seminar photo"></article>
          <article class="gallery-card">
            <img class="gallery-photo" src="assets/gallery/nuaa_1.jpg" alt="Conference photo"></article>
          <article class="gallery-card">
            <img class="gallery-photo" src="assets/gallery/csu_gate.png" alt="Lab space photo"></article>
          <article class="gallery-card">
            <img class="gallery-photo" src="assets/gallery/climbing.jpg" alt="Team daily life photo"></article>
          <article class="gallery-card">
            <img class="gallery-photo" src="assets/gallery/lovecsu.png" alt="Campus and daily moments"></article>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Big Data for Urban Intelligence Lab. <span class="footer-update">Data updated: <time datetime="2026-06-29">June 29, 2026</time></span></p>
      <a href="#top">Back to Top</a>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
